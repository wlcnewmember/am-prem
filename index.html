<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>AM Prem Free | Claim Otomatis</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      background: radial-gradient(circle at 20% 30%, #0b0b1a, #000000);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(10, 10, 30, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      border: 1px solid rgba(100, 200, 255, 0.15);
      padding: 3rem 2rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(100, 200, 255, 0.05) inset;
      text-align: center;
      animation: fadeUp 0.8s ease;
      position: relative;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lang-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #88ccff;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: #00d4ff; }
    .lang-btn i { font-size: 1rem; }

    .logo-icon { font-size: 4rem; background: linear-gradient(135deg, #00d4ff, #7b2ffc); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 15px; }
    h1 { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 2.2rem; background: linear-gradient(135deg, #ffffff, #a0c0ff); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 2px; margin-bottom: 10px; }
    .sub { font-size: 1rem; color: #8899bb; letter-spacing: 1px; font-weight: 800; }
    .divider { width: 80px; height: 3px; background: linear-gradient(90deg, #00d4ff, #7b2ffc); margin: 20px auto; border-radius: 10px; }

    .note-box {
      background: rgba(255, 200, 50, 0.05);
      border: 1px solid rgba(255, 200, 50, 0.15);
      border-radius: 12px;
      padding: 14px 18px;
      margin: 15px 0;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .note-box i { color: #fbbf24; font-size: 1.2rem; margin-top: 2px; }
    .note-box p { font-size: 0.8rem; color: #c0c8e0; font-weight: 700; line-height: 1.5; }

    .akun-box {
      background: rgba(0, 20, 40, 0.5);
      border: 1px solid rgba(100, 200, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
    }

    .akun-box p { font-size: 0.9rem; color: #aac0f0; margin: 8px 0; word-break: break-all; }
    .akun-box .label { color: #667799; font-size: 0.7rem; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 6px; }

    .btn-primary {
      background: linear-gradient(135deg, #00d4ff, #7b2ffc);
      border: none;
      color: white;
      font-weight: 800;
      font-size: 1.2rem;
      padding: 18px 30px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 15px;
      letter-spacing: 1px;
      box-shadow: 0 0 30px rgba(0, 180, 255, 0.2);
    }

    .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 50px rgba(0, 180, 255, 0.4); }

    .btn-copy {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-copy:hover { background: rgba(255, 255, 255, 0.1); }

    .btn-generator {
      background: rgba(0, 180, 255, 0.1);
      border: 1px solid rgba(0, 180, 255, 0.2);
      color: #88ccff;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-generator:hover { background: rgba(0, 180, 255, 0.2); }

    .footer { margin-top: 30px; font-size: 0.7rem; color: #445577; font-weight: 700; letter-spacing: 1px; }
    .footer i { color: #00d4ff; margin: 0 4px; }

    .badge {
      display: inline-block;
      background: rgba(0, 180, 255, 0.1);
      border: 1px solid rgba(0, 180, 255, 0.2);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.7rem;
      color: #88ccff;
      font-weight: 700;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .container { padding: 2rem 1.5rem; }
      h1 { font-size: 1.8rem; }
      .logo-icon { font-size: 3rem; }
      .lang-btn { top: 12px; right: 12px; padding: 5px 12px; font-size: 0.65rem; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- TOMBOL BAHASA -->
  <button class="lang-btn" id="langToggle" onclick="toggleLanguage()">
    <i class="fas fa-language"></i> <span id="langLabel">ID</span>
  </button>

  <div class="logo-icon"><i class="fas fa-crown"></i></div>
  <h1>AM PREM FREE</h1>
  <div class="sub">Claim Otomatis • Satu Klik</div>
  <div class="divider"></div>

  <div class="badge" style="margin: 10px 0 5px;">
    <i class="fas fa-bolt"></i> <span id="badgeText">Memuat akun...</span>
  </div>

  <!-- NOTE CEK STATUS EMAIL -->
  <div class="note-box">
    <i class="fas fa-lightbulb"></i>
    <p id="noteText"><strong>Cek Status Email:</strong> Buka generator untuk melihat apakah email masih aktif. Jika tidak aktif, klik <strong>"Ambil Akun Baru"</strong> untuk mendapatkan akun lain.</p>
  </div>

  <div id="akunDisplay" class="akun-box">
    <p class="label"><i class="fas fa-envelope"></i> <span id="labelEmail">EMAIL</span></p>
    <p id="emailDisplay">-</p>
    <p class="label" style="margin-top: 12px;"><i class="fas fa-link"></i> <span id="labelGenerator">GENERATOR EMAIL</span></p>
    <p id="generatorDisplay">-</p>
    <div style="margin-top: 12px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
      <button class="btn-copy" id="copyEmailBtn"><i class="fas fa-copy"></i> <span id="btnCopy">Copy Email</span></button>
      <button class="btn-generator" id="openGeneratorBtn"><i class="fas fa-external-link-alt"></i> <span id="btnGenerator">Buka Generator</span></button>
    </div>
  </div>

  <button class="btn-primary" id="claimBtn">
    <i class="fas fa-gift"></i> <span id="btnClaim">Ambil Akun Baru</span>
  </button>

  <div class="footer">
    <i class="fas fa-copyright"></i> 2025 • AM Prem Free
  </div>
</div>

<script>
  let akunList = [];
  let currentAkun = null;
  let usedIndices = [];
  let lang = 'id';

  // ===== LOAD AKUN DARI FILE JSON =====
  async function loadAkun() {
    try {
      const response = await fetch('akun.json');
      const rawData = await response.json();
      akunList = rawData.map(email => ({
        email: email,
        generatorLink: `https://generator.email/${email}`
      }));
      document.getElementById('badgeText').textContent = akunList.length + ' Akun Premium Tersedia';
      const firstAkun = ambilAkunAcak();
      if (firstAkun) tampilkanAkun(firstAkun);
    } catch (e) {
      console.error('Gagal load akun:', e);
      document.getElementById('badgeText').textContent = 'Gagal memuat akun';
    }
  }

  function ambilAkunAcak() {
    if (usedIndices.length >= akunList.length) {
      alert('Stok akun habis!');
      return null;
    }
    let randomIndex;
    do {
      randomIndex = Math.floor(Math.random() * akunList.length);
    } while (usedIndices.includes(randomIndex));
    usedIndices.push(randomIndex);
    return akunList[randomIndex];
  }

  function tampilkanAkun(akun) {
    if (!akun) return;
    currentAkun = akun;
    document.getElementById('emailDisplay').textContent = akun.email;
    document.getElementById('generatorDisplay').textContent = akun.generatorLink;
  }

  // ===== EVENT LISTENER =====
  document.getElementById('claimBtn').addEventListener('click', function() {
    const akun = ambilAkunAcak();
    if (akun) tampilkanAkun(akun);
    else alert('Stok akun habis!');
  });

  document.getElementById('copyEmailBtn').addEventListener('click', function() {
    if (!currentAkun) { alert('Ambil akun dulu!'); return; }
    navigator.clipboard.writeText(currentAkun.email).then(() => {
      alert('Email berhasil disalin!');
    }).catch(() => {
      alert('Gagal menyalin, copy manual aja.');
    });
  });

  document.getElementById('openGeneratorBtn').addEventListener('click', function() {
    if (!currentAkun) { alert('Ambil akun dulu!'); return; }
    window.open(currentAkun.generatorLink, '_blank');
  });

  // ===== TERJEMAHAN =====
  function toggleLanguage() {
    lang = (lang === 'id') ? 'en' : 'id';
    document.getElementById('langLabel').textContent = lang.toUpperCase();
    updateTranslation();
  }

  function updateTranslation() {
    const texts = {
      id: {
        badge: akunList.length + ' Akun Premium Tersedia',
        note: '<strong>Cek Status Email:</strong> Buka generator untuk melihat apakah email masih aktif. Jika tidak aktif, klik <strong>"Ambil Akun Baru"</strong> untuk mendapatkan akun lain.',
        labelEmail: 'EMAIL',
        labelGenerator: 'GENERATOR EMAIL',
        btnCopy: 'Copy Email',
        btnGenerator: 'Buka Generator',
        btnClaim: 'Ambil Akun Baru'
      },
      en: {
        badge: akunList.length + ' Premium Accounts Available',
        note: '<strong>Check Email Status:</strong> Open the generator to see if the email is still active. If not active, click <strong>"Get New Account"</strong> to get another account.',
        labelEmail: 'EMAIL',
        labelGenerator: 'EMAIL GENERATOR',
        btnCopy: 'Copy Email',
        btnGenerator: 'Open Generator',
        btnClaim: 'Get New Account'
      }
    };

    const t = texts[lang];
    document.getElementById('badgeText').innerHTML = t.badge;
    document.getElementById('noteText').innerHTML = t.note;
    document.getElementById('labelEmail').textContent = t.labelEmail;
    document.getElementById('labelGenerator').textContent = t.labelGenerator;
    document.getElementById('btnCopy').textContent = t.btnCopy;
    document.getElementById('btnGenerator').textContent = t.btnGenerator;
    document.getElementById('btnClaim').textContent = t.btnClaim;
  }

  // ===== START =====
  loadAkun();
  console.log('AM Prem Free siap!');
</script>
</body>
</html>
