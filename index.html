  <style>

      padding: 18px 30px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 25px;
      letter-spacing: 1px;
      box-shadow: 0 0 30px rgba(0, 180, 255, 0.2);
    }

    .btn-primary:hover {

    }

    .btn-secondary {

      font-weight: 700;
      font-size: 0.9rem;
      padding: 12px 20px;
      border-radius: 60px;
      width: 100%;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 12px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .footer {

      font-size: 0.7rem;
      color: #445577;
      font-weight: 700;
      letter-spacing: 1px;
    }
